<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pi harness architecture</title>
  <desc id="desc">A versioned repository applies one lean Pi harness to a macOS workstation and an Ubuntu homelab connected over private SSH, while credentials and runtime state remain local to each host.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f06292"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.8px; fill: #f9a8d4; }
      .heading { font: 700 52px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subheading { font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
      .card-label { font: 700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #a78bfa; }
      .card-title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .body { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .body-strong { font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f5f9; }
      .chip { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dbeafe; }
      .transport { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e0f2fe; }
      .transport-small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
      .footer { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .footer-strong { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <rect x="1" y="1" width="1598" height="898" rx="35" fill="none" stroke="#263244" stroke-width="2"/>
  <rect x="96" y="62" width="62" height="5" rx="2.5" fill="url(#accent)"/>
  <text class="eyebrow" x="96" y="102">PI HARNESS / CONTROL PLANE</text>
  <text class="heading" x="96" y="158">One harness. Two runtimes. Explicit authority.</text>

  <g filter="url(#shadow)">
    <rect x="96" y="204" width="1408" height="188" rx="24" fill="#121a26" stroke="#334155" stroke-width="2"/>
    <rect x="96" y="204" width="8" height="188" rx="4" fill="url(#accent)"/>
  </g>
  <text class="card-label" x="136" y="246">VERSIONED SOURCE OF TRUTH</text>
  <text class="card-title" x="136" y="288">Git repository</text>
  <text class="body" x="136" y="323">Portable configuration, selected capability owners, operating guidance, and the evidence behind each decision.</text>

  <g>
    <rect x="136" y="344" width="196" height="38" rx="19" fill="#1e293b" stroke="#475569"/>
    <text class="chip" x="158" y="369">pi/agent</text>
    <rect x="348" y="344" width="236" height="38" rx="19" fill="#1e293b" stroke="#475569"/>
    <text class="chip" x="370" y="369">lean profile</text>
    <rect x="600" y="344" width="246" height="38" rx="19" fill="#1e293b" stroke="#475569"/>
    <text class="chip" x="622" y="369">skills + prompts</text>
    <rect x="862" y="344" width="252" height="38" rx="19" fill="#1e293b" stroke="#475569"/>
    <text class="chip" x="884" y="369">terminal config</text>
    <rect x="1130" y="344" width="300" height="38" rx="19" fill="#1e293b" stroke="#475569"/>
    <text class="chip" x="1152" y="369">ADRs + operations</text>
  </g>

  <path d="M800 392 L800 428 L380 428 L380 458" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 392 L800 428 L1220 428 L1220 458" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="470" width="570" height="244" rx="24" fill="#111b27" stroke="#334155" stroke-width="2"/>
  </g>
  <circle cx="142" cy="516" r="16" fill="#f06292"/>
  <text class="card-label" x="174" y="522">LOCAL RUNTIME</text>
  <text class="card-title" x="136" y="568">macOS workstation</text>
  <text class="body-strong" x="136" y="614">cmux cockpit + native Git worktrees</text>
  <text class="body" x="136" y="652">Pi starts inside the real worktree so process cwd,</text>
  <text class="body" x="136" y="681">tool root, and subagent cwd stay aligned.</text>

  <g filter="url(#shadow)">
    <rect x="934" y="470" width="570" height="244" rx="24" fill="#111b27" stroke="#334155" stroke-width="2"/>
  </g>
  <circle cx="980" cy="516" r="16" fill="#38bdf8"/>
  <text class="card-label" x="1012" y="522">REMOTE RUNTIME</text>
  <text class="card-title" x="974" y="568">Ubuntu x86_64 homelab</text>
  <text class="body-strong" x="974" y="614">cmuxd-remote + detachable Linux PTYs</text>
  <text class="body" x="974" y="652">The same lean profile; credentials, package state,</text>
  <text class="body" x="974" y="681">and Pi sessions remain local to the host.</text>

  <path d="M666 582 L710 582" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M890 582 L934 582" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="710" y="518" width="180" height="128" rx="22" fill="#172033" stroke="#475569" stroke-width="2"/>
    <text class="transport" x="800" y="558" text-anchor="middle">Tailscale</text>
    <text class="transport" x="800" y="584" text-anchor="middle">+ SSH</text>
    <line x1="750" y1="600" x2="850" y2="600" stroke="#475569"/>
    <text class="transport-small" x="800" y="624" text-anchor="middle">private path</text>
  </g>

  <rect x="96" y="764" width="1408" height="88" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text class="footer-strong" x="136" y="802">Git carries:</text>
  <text class="footer" x="242" y="802">configuration • version pins • skills • guides • decisions • rollback</text>
  <text class="footer-strong" x="136" y="834">Hosts keep:</text>
  <text class="footer" x="242" y="834">credentials • OAuth • browser state • session logs • generated package state</text>
</svg>
