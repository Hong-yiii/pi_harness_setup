---
name: harness self-tests (not native acceptance)

"on":
  pull_request:
    paths:
      - "tests/**"
      - "scripts/**"
      - "pi/**"
      - "skills/**"
      - "automation/cmux-upgrade.mjs"
      - ".github/workflows/cmux-harness-tests.yml"
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "scripts/**"
      - "pi/**"
      - "skills/**"
      - "automation/cmux-upgrade.mjs"
      - ".github/workflows/cmux-harness-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          for file in tests/*.mjs tests/cmux/*.mjs scripts/*.mjs \
            scripts/browser-service/*.mjs \
            pi/agent/extensions/shared-browser/*.mjs \
            automation/cmux-upgrade.mjs; do
            node --check "$file"
          done
          for file in scripts/browser-service/*.sh; do
            bash -n "$file"
          done
      - name: Test the fixture, protocol, safety gates and regression oracle
        run: |
          node --test --test-timeout=20000 \
            tests/*.test.mjs tests/cmux/*.test.mjs
